name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: SCA - detectar pacotes vulneráveis (High/Critical)
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE 'High|Critical' vuln.txt; then
            echo "::error::Dependências vulneráveis (High/Critical) encontradas"
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # --- Fase 4: containerização ---------------------------------------------------------------
      # A tag é o SHA DO COMMIT, não `latest`. Tag móvel é a causa raiz de uma classe inteira de
      # "deploy que não muda nada": a imagem nova não substitui a antiga e o pod segue servindo
      # binário velho, com todo `kubectl get` dizendo que está tudo certo. Ver orchestration#40.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                     # ainda não: registry é a Parte 2
          # SÓ o SHA. `github.ref_name` NÃO serve de tag: em PR ele é `35/merge`, e numa branch
          # `feat/x` também tem barra. O Docker lê `users-api:35/merge` como registry `users-api`
          # na porta 35 — passa com push: false e quebra quando o push for ligado.
          tags: ${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true                      # carrega no daemon local, para o passo de smoke

      # Prova que a imagem SOBE, não só que compila. Um Dockerfile que builda e um container que
      # não inicia são coisas diferentes, e a segunda só aparece em produção.
      - name: A imagem inicia?
        run: |
          docker run -d --name smoke ${{ github.event.repository.name }}:${{ github.sha }}
          sleep 10
          docker logs smoke
          docker ps --filter name=smoke --filter status=running | grep -q smoke \
            || { echo "::error::o container morreu nos primeiros 10s"; docker logs smoke; exit 1; }
